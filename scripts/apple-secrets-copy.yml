name: Copy Apple signing secrets to Mintmark

# GitHub never reveals a stored secret, not even to the owner of the repository,
# so the six values already held in innotelinc/sage can only be moved sideways by
# a workflow that runs *in* sage and can read them there. Nothing needs to be
# regenerated: this copies the existing values and prints only names and lengths,
# never a value.
#
# One-time setup, in innotelinc/sage:
#   1. Create a fine-grained token scoped to innotelinc/mintmark with
#      "Secrets: read and write" (Settings -> Developer settings -> Tokens).
#   2. Store it in sage as the secret CROSS_REPO_SECRETS_TOKEN.
#   3. Put this file at .github/workflows/copy-apple-secrets.yml in sage.
#   4. Actions -> Copy Apple signing secrets to Mintmark -> Run workflow.
#
# This file lives in the Mintmark repository only as the source of that copy; it
# is inert here because the secrets it reads belong to sage.
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Repository that should receive the values
        type: string
        default: innotelinc/mintmark

jobs:
  copy:
    name: Copy six secrets
    runs-on: ubuntu-latest
    steps:
      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_SECRETS_TOKEN }}
          TARGET: ${{ inputs.target_repo }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CROSS_REPO_SECRETS_TOKEN is not set in this repository"; exit 1
          fi
          fail=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY IOS_DIST_P12 IOS_DIST_P12_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty here, so there is nothing to copy"
              fail=1
              continue
            fi
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET"
            echo "set $name (${#value} chars)"
          done
          exit "$fail"
