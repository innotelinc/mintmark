name: Mintmark iOS TestFlight

# TestFlight needs macOS and Xcode, which this project does not have locally:
# the build runs on a GitHub macOS runner and uploads itself. The app is the
# native Expo client in mobile/.
#
# Signing reuses the estate's App Store Connect credentials, the same names used
# for Sage:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY  (API key: signing + upload)
#   IOS_DIST_P12, IOS_DIST_P12_PASSWORD                        (the distribution identity)
#
# The certificate is imported into a throwaway keychain so every run signs with
# the same identity. Letting Xcode mint one per run is what fills the team's
# certificate cap and then fails with "Choose a certificate to revoke".
#
# Repository variable:
#   MINTMARK_API_URL  the deployed Worker origin, e.g. https://mintmark.example.workers.dev
#                     (baked into the app, so it must be https and live)
#
# One-time, in App Store Connect: an app record with bundle id
# us.inotel.mintmark (SKU mintmark) must exist, or the upload is rejected.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: CFBundleShortVersionString for this build — App Store Connect will not take a second build under a version already in review
        type: string
        default: '1.0'
      upload:
        description: Upload the build to TestFlight
        type: boolean
        default: true
  push:
    tags:
      - 'mintmark-ios-v*'

concurrency:
  group: mintmark-ios-testflight
  cancel-in-progress: false

defaults:
  run:
    working-directory: mobile

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      API_URL: ${{ vars.MINTMARK_API_URL }}
      EXPO_PUBLIC_API_URL: ${{ vars.MINTMARK_API_URL }}
      BUNDLE_ID: us.inotel.mintmark
      IOS_MARKETING_VERSION: ${{ inputs.marketing_version || '1.0' }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check the API origin
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::MINTMARK_API_URL is not set. Add the deployed Worker origin as a repository variable (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::MINTMARK_API_URL must be an https origin"; exit 1 ;;
          esac
          echo "the app will call $API_URL"

      - name: Install ASC API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::ASC_KEY_ID / ASC_PRIVATE_KEY secrets are missing"; exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import the distribution certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_DIST_P12" ] || [ -z "$IOS_DIST_P12_PASSWORD" ]; then
            echo "::error::IOS_DIST_P12 / IOS_DIST_P12_PASSWORD secrets are missing"; exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/mintmark-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$IOS_DIST_P12" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/distribution.p12"
          echo "=== signing identities available to this run:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # expo prebuild writes ios/ from app.json: bundle id, permissions, icon.
      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --no-install

      - name: Install native dependencies
        run: |
          set -euo pipefail
          if [ -f ios/Podfile ]; then
            echo "CocoaPods project - running pod install"
            pod install --project-directory=ios
          else
            echo "::error::no ios/Podfile — expo prebuild did not produce a CocoaPods project"; exit 1
          fi

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_TEAM_ID" ]; then echo "::error::APPLE_TEAM_ID secret is missing"; exit 1; fi
          xcodebuild \
            -workspace ios/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mintmark.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            archive

      # A build that is missing its icon, its permissions or the bundled JS is
      # rejected by Apple after a long upload instead of failing here.
      - name: Verify the app bundle
        run: |
          set -euo pipefail
          APP=build/Mintmark.xcarchive/Products/Applications/App.app
          test -d "$APP"
          ICONS=$(ls -1 "$APP" | grep -ci '^AppIcon' || true)
          echo "compiled app icon resources: $ICONS"
          test "$ICONS" -ge 1 || { echo "::error::no AppIcon resources were compiled into the app"; exit 1; }
          test -f "$APP/Assets.car"
          test -f "$APP/main.jsbundle" || { echo "::error::the JavaScript bundle did not reach the app"; exit 1; }
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "bundle $BUNDLE $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          test "$BUNDLE" = "$BUNDLE_ID" || { echo "::error::unexpected bundle id $BUNDLE"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP/Info.plist" | grep -q . || { echo "::error::NSCameraUsageDescription is missing"; exit 1; }
          grep -a -q "$API_URL" "$APP/main.jsbundle" || { echo "::error::the API origin $API_URL is not in the bundled JS"; exit 1; }

      - name: Export the .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Mintmark.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lh build/ipa

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls build/ipa/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose

      - name: Keep the archive and .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintmark-ios-${{ github.run_number }}
          path: |
            mobile/build/Mintmark.xcarchive
            mobile/build/ipa
          if-no-files-found: warn
          retention-days: 14
