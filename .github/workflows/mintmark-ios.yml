name: Mintmark iOS TestFlight

# TestFlight needs macOS and Xcode, which this project does not have locally:
# the build runs on a GitHub macOS runner and uploads itself. The app is the
# native Expo client in mobile/.
#
# Signing needs four secrets and no certificate file:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
#
# The App Store Connect API key *is* the signing credential. With
# CODE_SIGN_STYLE=Automatic and -allowProvisioningUpdates, xcodebuild asks the
# developer portal for a distribution certificate and an App Store profile,
# creating them on the first run and reusing them after that. The private key for
# that certificate is generated on the runner and never leaves it, so nothing has
# to be exported as a .p12 or carried between repositories.
#
# The certificate cap only bites if a run mints a fresh certificate every time;
# innotelinc/sage's ios-cert-cleanup.yml exists to revoke the leftovers if that
# ever starts happening.
#
# Repository variable:
#   MINTMARK_API_URL  the deployed Worker origin, e.g. https://mintmark.example.workers.dev
#                     (baked into the app, so it must be https and live)
#
# One-time, in App Store Connect: an app record with bundle id
# us.inotel.mintmark (SKU mintmark) must exist, or the upload is rejected.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: CFBundleShortVersionString for this build — App Store Connect will not take a second build under a version already in review
        type: string
        default: '1.0'
      upload:
        description: Upload the build to TestFlight
        type: boolean
        default: true
  push:
    tags:
      - 'mintmark-ios-v*'

concurrency:
  group: mintmark-ios-testflight
  cancel-in-progress: false

defaults:
  run:
    working-directory: mobile

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      API_URL: ${{ vars.MINTMARK_API_URL }}
      EXPO_PUBLIC_API_URL: ${{ vars.MINTMARK_API_URL }}
      BUNDLE_ID: us.inotel.mintmark
      IOS_MARKETING_VERSION: ${{ inputs.marketing_version || '1.0' }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check the API origin
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::MINTMARK_API_URL is not set, so this build has no server baked in: testers are asked for one on first launch. Set the variable and rerun once the Worker is deployed."
          else
            case "$API_URL" in
              https://*) ;;
              *) echo "::error::MINTMARK_API_URL must be an https origin"; exit 1 ;;
            esac
            echo "the app will call $API_URL"
          fi

      - name: Install the App Store Connect API key
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set in this repository"
              missing=1
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::signing needs these four secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY"
            exit 1
          fi
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$KEY")"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          # A .p8 that will not parse is a truncated paste, not an Apple problem;
          # catching it here beats a cryptic portal error after the pod install.
          if ! openssl ec -in "$KEY" -noout -text > /dev/null 2>&1; then
            echo "::error::ASC_PRIVATE_KEY is not a valid .p8 (it must be the whole EC PRIVATE KEY block from App Store Connect)"
            exit 1
          fi
          echo "key $ASC_KEY_ID for team $APPLE_TEAM_ID is installed and parses as an EC private key"
          echo "xcodebuild will ask the portal for a distribution certificate and profile"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # expo prebuild writes ios/ from app.json: bundle id, permissions, icon.
      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --no-install

      - name: Install native dependencies
        run: |
          set -euo pipefail
          if [ -f ios/Podfile ]; then
            echo "CocoaPods project - running pod install"
            pod install --project-directory=ios
          else
            echo "::error::no ios/Podfile — expo prebuild did not produce a CocoaPods project"; exit 1
          fi

      # expo writes CFBundleVersion and CFBundleShortVersionString as literals
      # into Info.plist, so passing CURRENT_PROJECT_VERSION/MARKETING_VERSION to
      # xcodebuild does nothing: the first successful upload arrived as build 1
      # of version 0.1.0 while the run number was 6. App Store Connect refuses a
      # build number it already has, so every run must stamp its own here.
      - name: Stamp the version and build number
        run: |
          set -euo pipefail
          PLIST=$(ls ios/*/Info.plist 2>/dev/null | head -1)
          if [ -z "$PLIST" ]; then
            echo "::error::expo prebuild produced no Info.plist under ios/*/"
            ls ios || true
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" "$PLIST"
          echo "$PLIST: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST"))"

      # expo prebuild names the Xcode project after app.json's name, so nothing
      # here may assume it. Hard-coding "App" is why the first run failed with
      # "ios/App.xcworkspace does not exist" before compiling a single line.
      - name: Resolve the Xcode workspace and scheme
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::expo prebuild produced no .xcworkspace under ios/"
            ls ios || true
            exit 1
          fi
          # A CocoaPods workspace lists a scheme per pod, so the first one is
          # something like "boost". The app's scheme is the project's own name;
          # taking "the first scheme" archived a pod and produced no .app.
          PROJECT_NAME=$(basename "$(ls -d ios/*.xcodeproj | head -1)" .xcodeproj)
          SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE" -json 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d.get("workspace") or d.get("project") or {}; print("\n".join(d.get("schemes") or []))' \
            2>/dev/null | tr -d '\r' || true)
          if printf '%s\n' "$SCHEMES" | grep -qx "$PROJECT_NAME"; then
            SCHEME="$PROJECT_NAME"
          elif [ -n "$SCHEMES" ]; then
            SCHEME=$(printf '%s\n' "$SCHEMES" | grep -v -e '^Pods-' -e '^Pods$' | head -1)
            echo "::warning::$PROJECT_NAME is not a scheme here; using $SCHEME"
          else
            SCHEME="$PROJECT_NAME"
            echo "::warning::could not read the scheme list; assuming $SCHEME"
          fi
          echo "workspace $WORKSPACE, project $PROJECT_NAME, scheme $SCHEME"
          printf 'schemes: %s\n' "$(printf '%s' "$SCHEMES" | tr '\n' ' ')"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_TEAM_ID" ]; then echo "::error::APPLE_TEAM_ID secret is missing"; exit 1; fi
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mintmark.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            archive

      # A build that is missing its icon, its permissions or the bundled JS is
      # rejected by Apple after a long upload instead of failing here.
      - name: Verify the app bundle
        run: |
          set -euo pipefail
          APP=$(ls -d build/Mintmark.xcarchive/Products/Applications/*.app | head -1)
          test -d "$APP" || { echo "::error::the archive contains no .app"; ls build/Mintmark.xcarchive/Products/Applications || true; exit 1; }
          echo "app bundle: $APP"
          ICONS=$(ls -1 "$APP" | grep -ci '^AppIcon' || true)
          echo "compiled app icon resources: $ICONS"
          test "$ICONS" -ge 1 || { echo "::error::no AppIcon resources were compiled into the app"; exit 1; }
          test -f "$APP/Assets.car"
          # An archive is signed by whatever identity the portal hands back — in
          # practice an Apple Development one — and -exportArchive re-signs it for
          # distribution. So this checks that a signature exists at all; the
          # distribution assertion belongs on the exported .ipa.
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q '^Authority=' || {
            echo "::error::the archived app carries no code signature"
            codesign -dv --verbose=2 "$APP" 2>&1 | head -12
            exit 1
          }
          echo "archive signature: $(codesign -dv --verbose=2 "$APP" 2>&1 | grep -m1 '^Authority=')"
          test -f "$APP/main.jsbundle" || { echo "::error::the JavaScript bundle did not reach the app"; exit 1; }
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "bundle $BUNDLE $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          # A rebuild of a number Apple already has is rejected after the upload,
          # so fail here instead when the stamp did not take.
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$BUILT" = "$GITHUB_RUN_NUMBER" || { echo "::error::CFBundleVersion is $BUILT, not the run number $GITHUB_RUN_NUMBER"; exit 1; }
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          test "$SHORT" = "$IOS_MARKETING_VERSION" || { echo "::error::CFBundleShortVersionString is $SHORT, not $IOS_MARKETING_VERSION"; exit 1; }
          test "$BUNDLE" = "$BUNDLE_ID" || { echo "::error::unexpected bundle id $BUNDLE"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP/Info.plist" | grep -q . || { echo "::error::NSCameraUsageDescription is missing"; exit 1; }
          if [ -n "$API_URL" ]; then
            grep -a -q "$API_URL" "$APP/main.jsbundle" || { echo "::error::the API origin $API_URL is not in the bundled JS"; exit 1; }
          fi
          # supportsTablet is the only place the device family comes from, and Apple reads
          # it from the binary: an iPhone-only family ships as an iPhone app and leaves the
          # listing with no iPad slot, whatever the console offers.
          FAMILIES=$(/usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$APP/Info.plist" | tr -d '\n ' || true)
          echo "device families: $FAMILIES"
          case "$FAMILIES" in *2*) ;; *) echo "::error::the build does not declare the iPad family"; exit 1 ;; esac
          echo "the archive installs on iPhone and iPad"

      - name: Export the .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Mintmark.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lh build/ipa

          # This is the build Apple receives, so assert what Apple demands of it:
          # a distribution identity and a profile that is not a development one.
          IPA=$(ls build/ipa/*.ipa | head -1)
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          SHIPPED=$(ls -d "$RUNNER_TEMP"/ipa-check/Payload/*.app | head -1)
          echo "exported app: $SHIPPED"
          codesign -dv --verbose=2 "$SHIPPED" 2>&1 | grep -E '^(Authority|TeamIdentifier)=' || true
          codesign -dv --verbose=2 "$SHIPPED" 2>&1 | grep -qE 'Authority=(Apple Distribution|iPhone Distribution)' || {
            echo "::error::the exported .ipa is not signed by a distribution identity"
            exit 1
          }
          test -f "$SHIPPED/embedded.mobileprovision" || { echo "::error::the .ipa has no embedded provisioning profile"; exit 1; }
          PROFILE=$(security cms -D -i "$SHIPPED/embedded.mobileprovision" 2>/dev/null)
          echo "$PROFILE" | grep -q 'get-task-allow' && echo "::warning::the profile allows debugging (get-task-allow)" || true
          echo "$PROFILE" | grep -q 'ProvisionsAllDevices' && { echo "::error::an enterprise profile was exported, not an App Store one"; exit 1; } || true
          echo "exported .ipa is distribution signed with an embedded profile"

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls build/ipa/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose

      # app.json's ITSAppUsesNonExemptEncryption: false is what answers this question,
      # Apple doing it during processing; the step only checks that the declaration still
      # reaches the binary. A build it does not reach is "Missing Compliance" in TestFlight
      # and no tester can install it, so the run fails instead of looking healthy.
      - name: Check export compliance
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: us.inotel.mintmark
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/asc-compliance.mjs

      - name: Keep the archive and .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintmark-ios-${{ github.run_number }}
          path: |
            mobile/build/Mintmark.xcarchive
            mobile/build/ipa
          if-no-files-found: warn
          retention-days: 14
